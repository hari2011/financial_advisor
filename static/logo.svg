<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b"/>
      <stop offset="100%" style="stop-color:#312e81"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fde68a"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#4ade80"/>
    </linearGradient>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="innerglow">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>

  <!-- Background: Deep indigo rounded square -->
  <rect x="2" y="2" width="116" height="116" rx="26" fill="url(#bg)" stroke="#4338ca" stroke-width="1"/>

  <!-- Subtle grid pattern (represents data/analysis) -->
  <g opacity="0.08" stroke="#818cf8" stroke-width="0.5">
    <line x1="20" y1="2" x2="20" y2="118"/><line x1="40" y1="2" x2="40" y2="118"/>
    <line x1="60" y1="2" x2="60" y2="118"/><line x1="80" y1="2" x2="80" y2="118"/>
    <line x1="100" y1="2" x2="100" y2="118"/>
    <line x1="2" y1="20" x2="118" y2="20"/><line x1="2" y1="40" x2="118" y2="40"/>
    <line x1="2" y1="60" x2="118" y2="60"/><line x1="2" y1="80" x2="118" y2="80"/>
    <line x1="2" y1="100" x2="118" y2="100"/>
  </g>

  <!-- Shield outline (privacy/security) -->
  <path d="M60 18 C60 18 88 24 92 24 C92 52 92 68 60 98 C28 68 28 52 28 24 C32 24 60 18 60 18Z"
        fill="none" stroke="url(#glow)" stroke-width="1.8" opacity="0.35"/>

  <!-- Rising bar chart (wealth growth) -->
  <g filter="url(#softglow)">
    <rect x="32" y="72" width="8" height="18" rx="2" fill="url(#green)" opacity="0.7"/>
    <rect x="44" y="62" width="8" height="28" rx="2" fill="url(#green)" opacity="0.8"/>
    <rect x="56" y="50" width="8" height="40" rx="2" fill="url(#green)" opacity="0.9"/>
    <rect x="68" y="38" width="8" height="52" rx="2" fill="url(#green)"/>
    <rect x="80" y="28" width="8" height="62" rx="2" fill="url(#gold)"/>
  </g>

  <!-- Trend arrow (growth trajectory) -->
  <polyline points="34,70 48,58 60,46 72,34 84,24"
            stroke="#fde68a" stroke-width="2" fill="none"
            stroke-linecap="round" stroke-linejoin="round" opacity="0.9" filter="url(#softglow)"/>
  <polygon points="84,20 90,26 82,28" fill="#fde68a" opacity="0.9"/>

  <!-- Rupee symbol ₹ (Indian finance, centered on tallest bar) -->
  <text x="84" y="58" text-anchor="middle" dominant-baseline="central"
        font-family="'Inter','Helvetica Neue',Arial,sans-serif"
        font-size="20" font-weight="700" fill="white" opacity="0.95">₹</text>

  <!-- AI brain/neural dots (intelligence network) -->
  <g filter="url(#softglow)">
    <!-- Neural nodes -->
    <circle cx="24" cy="34" r="3" fill="#818cf8" opacity="0.8"/>
    <circle cx="18" cy="50" r="2.5" fill="#818cf8" opacity="0.6"/>
    <circle cx="26" cy="54" r="2" fill="#a78bfa" opacity="0.7"/>
    <circle cx="16" cy="38" r="2" fill="#a78bfa" opacity="0.5"/>
    <!-- Neural connections -->
    <line x1="24" y1="34" x2="18" y2="50" stroke="#818cf8" stroke-width="1" opacity="0.4"/>
    <line x1="24" y1="34" x2="26" y2="54" stroke="#818cf8" stroke-width="1" opacity="0.4"/>
    <line x1="24" y1="34" x2="16" y2="38" stroke="#a78bfa" stroke-width="1" opacity="0.3"/>
    <line x1="18" y1="50" x2="26" y2="54" stroke="#a78bfa" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- Sparkle (AI magic) on top of gold bar -->
  <g transform="translate(84,22)" opacity="0.9">
    <line x1="0" y1="-5" x2="0" y2="5" stroke="#fde68a" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-5" y1="0" x2="5" y2="0" stroke="#fde68a" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-3" y1="-3" x2="3" y2="3" stroke="#fde68a" stroke-width="1" stroke-linecap="round"/>
    <line x1="3" y1="-3" x2="-3" y2="3" stroke="#fde68a" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- Lock icon (bottom-left, privacy) -->
  <g transform="translate(20,94)" opacity="0.5">
    <rect x="-5" y="0" width="10" height="8" rx="1.5" fill="#818cf8"/>
    <path d="M-3,0 L-3,-3 A3,3 0 0,1 3,-3 L3,0" fill="none" stroke="#818cf8" stroke-width="1.5"/>
    <circle cx="0" cy="4" r="1.2" fill="#1e1b4b"/>
  </g>

  <!-- Bottom tagline bar -->
  <rect x="30" y="102" width="60" height="12" rx="6" fill="rgba(99,102,241,0.2)"/>
  <text x="60" y="110" text-anchor="middle" dominant-baseline="central"
        font-family="'Inter',sans-serif" font-size="6.5" font-weight="600"
        fill="#a5b4fc" letter-spacing="1.5">AI · LOCAL · INDIA</text>
</svg>
